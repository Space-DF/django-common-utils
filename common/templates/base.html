<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{% endblock %}</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      color: #667085;
    }

    .content{
      max-width: 590px;
      margin: 0 auto;
      padding: 40px 0px 10px;
      text-align: center;
      padding: 25px 25px;
    }

    a {
      text-decoration: none;
    }

    .logo {
      margin-bottom: 20px;
    }

    .illustration img {
      width: 100%;
      max-width: 350px;
      text-align: start;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      font-weight: 500;
    }

    p {
      font-size: 16px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .footer {
      color: #fff;
      padding: 20px 5px 10px;
      border-radius: 16px;
      max-width: 590px;
      margin: 0 auto;
    }

    .footer table.footer-table {
      padding: 0px 20px;
    }

    .footer-logo {
      font-weight: bold;
      font-size: 18px;
    }

    .footer-top {
      display: flex;
    }

    .footer-bottom {
      display: flex;
      font-size: 16px;
      color: #FFFFFF;
      margin-top: 5px;
    }

    .round {
      display: inline-block; 
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%; 
      width: 40px; 
      height: 40px; 
      text-align: center;
      margin-left: 10px;
    }

    .footer-bottom a {
      color: #FFFFFF;
      font-size: 15px;
    }
    
    table td a{
      color: white !important;
    }

    .footer-bottom p {
      color: #FFFFFF;
      font-size: 15px;
    }

    .btn-invite {
        display: inline-block;
        padding: 15px 20px 15px 20px;
        border-radius: 10px;
        text-decoration: none;
        background-image: url('{{ host }}/static/images/icons/arrow_up.png');
        background-repeat: no-repeat;
        background-position: right 8px center;
        background-size: 18px 18px;
        padding-right: 30px;
    }

    .btn-invite:hover {
        background-color: #292626;
    }
  </style>
</head>
<body >
  <div class="content" style="background-color: {{ background_color }};">
    <div class="container">
      <div class="logo">
        <img src="{% if active_brand_header_logo %}{{ active_brand_header_logo }}{% else %}{{ host }}/static/images/branding/logo_black.png{% endif %}" width="200" height="50" alt="Logo" />
      </div>

      {% block content %}{% endblock %}

    </div>
    <div class="footer" style="background-color: {{ primary_color }};">
      
      <table class="footer-table" width="100%" cellpadding="0" cellspacing="0" role="presentation">
        <tr>
          <td align="left">
            <img src="{% if active_brand_footer_logo %}{{ active_brand_footer_logo }}{% else %}{{ host }}/static/images/branding/logo_white.png{% endif %}" width="180" height="50" alt="Logo" />
          </td>
          <td align="right">
            <table cellpadding="0" cellspacing="0" role="presentation">
              <tr>
                {% if show_linkedin != False %}
                <td>
                  <a class="round"href="{{ linkedin_url }}" class="round">
                    <img src="{% if contrast_primary_color == '#000000' %}{{ host }}/static/images/social/linkedin_black.png{% else %}{{ host }}/static/images/social/linkedin_white.png{% endif %}" width="24" height="24" alt="LinkedIn" style="margin-top: 8px;" />
                  </a>
                </td>
                {% endif %}
                {% if show_facebook != False %}
                <td>
                  <a class="round" href="{{ facebook_url }}" class="round">
                    <img src="{% if contrast_primary_color == '#000000' %}{{ host }}/static/images/social/facebook_black.png{% else %}{{ host }}/static/images/social/facebook_white.png{% endif %}" width="24" height="24" alt="Facebook" style="margin-top: 8px;" />
                  </a>
                </td>
                {% endif %}
                {% if show_instagram != False %}
                <td>
                  <a class="round" href="{{ instagram_url }}" class="round">
                    <img src="{% if contrast_primary_color == '#000000' %}{{ host }}/static/images/social/instagram_black.png{% else %}{{ host }}/static/images/social/instagram_white.png{% endif %}" width="24" height="24" alt="Instagram" style="margin-top: 8px;" />
                  </a>
                </td>
                {% endif %}
                {% if show_tiktok != False %}
                <td>
                  <a class="round" href="{{ tiktok_url }}">
                    <img src="{% if contrast_primary_color == '#000000' %}{{ host }}/static/images/social/tiktok_black.png{% else %}{{ host }}/static/images/social/tiktok_white.png{% endif %}" width="24" height="24" alt="TikTok" style="margin-top: 8px;" />
                  </a>
                </td>
                {% endif %}
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td>
            <p style="display: block; float: left; color: {{ contrast_primary_color }};">{{ email_footer }}</p>
          </td>
        </tr>
      </table>
    </div>
  </div>
</body>
</html>
